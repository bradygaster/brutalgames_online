<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Warden Test Cabinet</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #83ff3c 0, rgba(131, 255, 60, 0.2) 22%, transparent 23%),
        linear-gradient(180deg, #050505 0%, #111111 100%);
      color: #fffdf7;
    }

    main {
      width: min(90vw, 48rem);
      padding: 2rem;
      border: 4px solid #fffdf7;
      background: rgba(5, 5, 5, 0.86);
      box-shadow: 14px 14px 0 #2d7fff;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 5vw, 3.4rem);
      text-transform: uppercase;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Grid Warden Test Cabinet</h1>
    <p>This placeholder cabinet keeps the active launch path working while the full game is still under construction.</p>
  </main>
</body>
</html>
