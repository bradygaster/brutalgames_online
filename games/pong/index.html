<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PONG</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../index.html">&larr; Back to console</a>
    <h1 class="title">PONG</h1>

    <div class="hud">
      <div class="hud-item">SCORE <span id="score">0 - 0</span></div>
      <div class="hud-item">RALLY <span id="rally">0</span></div>
      <div class="hud-item">WINS <span id="wins">0</span></div>
      <div class="hud-item">HIGH <span id="high">0</span></div>
      <div class="hud-item">MODE <span id="mode">1P</span></div>
    </div>

    <div class="frame">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="overlay">
        <h2 id="overlay-title">PONG</h2>
        <p id="overlay-msg">Press ENTER to start</p>
      </div>
    </div>

    <ul class="controls">
      <li><kbd>W</kbd><kbd>S</kbd> / <kbd>↑</kbd><kbd>↓</kbd> Move paddle</li>
      <li><kbd>T</kbd> 1P / 2P (<kbd>I</kbd><kbd>K</kbd> for P2)</li>
      <li><kbd>P</kbd> Pause</li>
      <li><kbd>ENTER</kbd> Start / Restart</li>
    </ul>
  </main>
  <script src="game.js"></script>
</body>
</html>
