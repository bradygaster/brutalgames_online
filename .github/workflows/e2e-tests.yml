name: E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start local static server
        run: |
          mkdir -p test-results
          npm run serve:test > test-results/static-server.log 2>&1 &
          npx wait-on http://127.0.0.1:4173

      - name: Run Playwright suite
        env:
          CI: true
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
        run: npx playwright test

      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload video recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ github.run_id }}
          path: test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 14
